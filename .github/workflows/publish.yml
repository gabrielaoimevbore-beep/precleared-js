name: Publish to npm

# Runs when a GitHub release is published. Uses npm trusted publishing (OIDC),
# so no npm token is stored anywhere, and npm adds provenance to the package page.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships with npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public
